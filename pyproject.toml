[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elas-ti"
version = "0.1.0"
requires-python = ">=3.11"
description = "Estudo longitudinal da participação feminina estimada nos cursos de TI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
markers = ["integration: validação opcional com PDFs institucionais locais"]
